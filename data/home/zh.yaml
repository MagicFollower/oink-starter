sections: [hero, cards, cta]

hero:
  align: center
  eyebrow: Java 学习笔记
  title_lines:
    - words: [{ text: 系统掌握 Java， }]
    - words: [{ text: 从基础到架构。 }]
  lead: 一份结构化整理的 Java 知识体系，涵盖语言基础、并发、JVM、Spring 与中间件。
  actions:
    - { label: 开始阅读, url: docs/01-java-base/, icon: fa-solid fa-book, style: primary }
    - { label: 浏览全部笔记, url: docs/, icon: fa-solid fa-layer-group, style: ghost }

cards:
  eyebrow: 知识体系
  title: 按模块逐步深入
  columns: 3
