sections: [hero, cards, cta]

hero:
  align: center
  eyebrow: Apache RocketMQ 中文文档
  title_lines:
    - words: [{ text: 吃透 RocketMQ， }]
    - words: [{ text: 从领域模型到生产运维。 }]
  lead: 一份按知识板块重组的 RocketMQ 中文文档：5.0 与 4.x 全量内容、四类消息机制、消费行为、部署容灾、mqadmin 命令与生态组件。
