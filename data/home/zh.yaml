sections: [hero, cards, cta]

hero:
  align: center
  eyebrow: "Apache ZooKeeper 3.8.7"
  title_lines:
    - words: [{ text: "把分布式协调讲清楚" }]
  lead: "从「为什么需要它」开始，讲清数据模型、单机上手、端口与管理接口、三节点集群与生产运维；再沿着 Dubbo 架构与 ZooKeeper 节点，走通注册发现，最后从空目录搭一套 Spring Boot 2.7 + Dubbo 的可运行工程。命令与输出都来自本机发行包和可运行工程。"
  actions:
    - { label: "开始阅读", url: "docs/01-overview/认识ZooKeeper/why-zookeeper/", icon: "fa-solid fa-book", style: "primary" }
    - { label: "浏览全部文档", url: "docs/", icon: "fa-solid fa-layer-group", style: "ghost" }

cards:
  eyebrow: "按主题浏览"
  title: "文档地图"
  columns: 3
  items:
    - { title: "概览", desc: "先回答 ZooKeeper 是什么、为什么需要它，再沿前生今世、数据模型与整体架构建立完整心智模型。", icon: "fa-solid fa-compass", url: "docs/01-overview/" }
    - { title: "快速开始", desc: "用本机 3.8.7 发行包完成单机安装、配置、启停、端口排查与第一次 zkCli 操作。", icon: "fa-solid fa-rocket", url: "docs/02-getting-started/" }
    - { title: "集群与运维", desc: "把单机推进到三节点 ensemble，覆盖选主、管理面、监控、快照、日志与常见故障。", icon: "fa-solid fa-server", url: "docs/03-cluster-operations/" }
    - { title: "参考", desc: "配置项、管理面收口与命令行工具的速查，面向已经跑起来、需要查参数和排障的读者。", icon: "fa-solid fa-book-open", url: "docs/04-reference/" }
    - { title: "常见问题", desc: "保留真实问答现场的速查页，适合按症状定位，再跳到对应主题的完整文档。", icon: "fa-solid fa-circle-question", url: "docs/05-faq/" }
    - { title: "Dubbo 集成", desc: "从 Dubbo 架构、选型与运行时拓扑，到注册发现流程、生效原理和 ZooKeeper 节点读写，再用可运行工程完成一次真实集成。", icon: "fa-solid fa-plug", url: "docs/06-dubbo-integration/" }
    - { title: "Dubbo 实战", desc: "从空目录开始，用 Spring Boot 2.7.18、Java 8、Dubbo 3.2.20 与 ZooKeeper 搭一套可运行的多模块 RPC 工程：模块拆分、契约、配置、提供者、消费者、动态引用、验收与排障。", icon: "fa-solid fa-flask", url: "docs/07-dubbo-springboot-lab/" }

cta:
  title: "从痛点开始"
  text: "先看没有协调服务时会发生什么，再进入安装、集群、运维，最后落到 Dubbo 注册中心。"
  label: "开始阅读"
  url: "docs/01-overview/认识ZooKeeper/why-zookeeper/"
  style: "primary"
