    - title: Spring 生态
      desc: IoC、AOP 原理，Spring Boot 自动配置与实战。
      icon: fa-solid fa-leaf
      url: docs/05-spring/

cta:
  title: 开始你的 Java 学习之旅。
  text: 从语言基础出发，逐步深入并发、JVM 与框架生态。
