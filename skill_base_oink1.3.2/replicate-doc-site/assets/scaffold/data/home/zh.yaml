sections: [hero, cards, cta]

# 首页数据源与站点标题是两处独立配置：只改 hugo.yaml 的 title 会出现「标题改了一半」。
hero:
  align: center
  eyebrow: 【眉标，如 Apache XXX 中文文档】
  title_lines:
    - words: [{ text: 【主标题第一行，】 }]
    - words: [{ text: 【主标题第二行。】 }]
  lead: 【两行以内的导语：这份文档覆盖什么、按什么组织。】
  actions:
    - { label: 开始阅读, url: docs/01-【首个一级分类目录】/, icon: fa-solid fa-book, style: primary }
    - { label: 浏览全部文档, url: docs/, icon: fa-solid fa-layer-group, style: ghost }

cards:
  eyebrow: 【小节眉标】
  title: 【小节标题】
  columns: 3
  items:
    - title: 【分类A】
      desc: 【一句话说明该分类覆盖什么。】
      icon: fa-solid fa-cubes
      url: docs/02-【分类A目录】/
    - title: 【分类B】
      desc: 【一句话说明。】
      icon: fa-solid fa-paper-plane
      url: docs/04-【分类B目录】/
    - title: 【分类C】
      desc: 【一句话说明。】
      icon: fa-solid fa-server
      url: docs/06-【分类C目录】/

cta:
  title: 【行动号召标题】
  text: 【号召副文案。】
  label: 快速开始
  url: docs/03-【快速开始目录】/
  style: primary
