server {
    listen 80;
    server_name kbst-web;
    root /usr/share/nginx/html;

    # 这一条路由只存在于「挂载进来的这份配置」里 —— 它能被取到，就证明 bind + :ro 生效了
    location /storage-probe/ {
        default_type text/plain;
        return 200 "probe-ok from ro-bind config
";
    }
    # 这一条用来验「写日志到底写进了卷还是可写层」
    location /write-probe {
        access_log /var/log/nginx/probe.access.log;
        default_type text/plain;
        return 200 "logged to /var/log/nginx/probe.access.log
";
    }
    location /logs {
        alias /var/log/nginx/;
        autoindex on;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
