# 【站点名】文档站配置 —— 由 replicate-doc-site 技能生成的骨架
# 落地前必须逐个替换【】占位；全部替换完的判据是 scaffold.py 报 placeholders_remaining=0。
title: &siteTitle 【站点标题】 # 站点标题（浏览器标签、顶栏、页脚）
baseURL: https://example.org/ # CHANGE ME: canonical production URL
relativeURLs: true # 相对链接：构建产物可直接从磁盘路径打开，也可挂任意子路径
defaultContentLanguage: zh
enableGitInfo: false
  # 说明：enableGitInfo 从 Git 提交记录读每页最后修改时间。
  # 未纳入 Git 或内网环境保持 false，否则会因 dubious ownership 等报错中断构建。
enableRobotsTXT: true
enableEmoji: true
timeZone: UTC

languages:
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 1
    title: *siteTitle
    hasCJKLanguage: true
    params:
      description: 【一句话站点摘要，用于 SEO 与首页 meta】

# OINK 的 Markdown 组件依赖这三项 Goldmark 设置，删掉会让 callout/图表失效。
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false

# markdown 输出让每页额外产出可下载的 .md；print 供整站打印档。
outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

params:
  offline_search: true
  copyright:
    authors: 【版权主体】
    from_year: 【起始年】
  footer_center_info: '【页脚一行说明，例如内容来源与授权口径】'
  ui:
    dark_mode: true
    section_index: cards
    blog_index: cards
    sidebar_menu_foldable: true
    sidebar_expand_levels: 4
    sidebar_icon_policy: groups
    backlinks: true
    # theme_color: '#245f94'
    # typography: system
    # image_zoom: true
    # share: [mastodon, linkedin, email, copy]
    # feedback: { enable: true, reasons: true }
  # github_repo: https://github.com/OWNER/REPOSITORY
  # github_branch: main
  # logo: icons/logo.svg
  # wordmark: icons/wordmark.svg

module:
  imports:
    - path: github.com/pgsty/oink
      replacement: ./oink-main/oink-main
  hugoVersion:
    extended: true
    min: 0.160.1
