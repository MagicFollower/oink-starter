{{- $page := .page -}}
{{- $config := partial "shell/blog-gallery-config.html" $page -}}
{{- $page.Store.Set "hasBlogGallery" true -}}
<section class="td-blog-gallery" data-td-blog-form="gallery" data-td-blog-gallery data-td-mode="{{ $config.mode }}" data-td-size="{{ $config.size }}" aria-label="{{ $page.Title }}">
  <div class="td-expo-toolbar" data-gallery-controls hidden>
    <fieldset class="td-expo-modes">
      <legend class="visually-hidden">{{ T "ui_expo_layout" }}</legend>
      {{ range slice "wall" "cards" "seamless" }}
      <label class="td-expo-mode" title="{{ T (printf "ui_expo_%s" .) }}">
        <input type="radio" name="td-blog-gallery-mode" value="{{ . }}" data-gallery-mode aria-label="{{ T (printf "ui_expo_%s" .) }}">
        <span class="td-expo-button">{{ partial "shell/icon.html" . }}</span>
      </label>
      {{ end }}
    </fieldset>
    <label class="td-expo-size">
      <span class="td-expo-size__small" aria-hidden="true">{{ partial "shell/icon.html" "image" }}</span>
      <input type="range" min="160" max="360" step="20" value="{{ $config.size }}" data-gallery-size aria-label="{{ T "ui_expo_size" }}">
      <span class="td-expo-size__large" aria-hidden="true">{{ partial "shell/icon.html" "image" }}</span>
    </label>
  </div>
  <div class="td-blog-gallery__grid" data-gallery-grid>
    {{ range .pages }}{{ partial "shell/blog-gallery-item.html" . }}{{ end }}
  </div>
</section>
