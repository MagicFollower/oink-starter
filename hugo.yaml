# RocketMQ 文档站复刻 — 站点配置
title: &siteTitle RocketMQ 文档 # 站点标题
baseURL: https://example.org/ # CHANGE ME: canonical production URL
relativeURLs: true # 相对链接：构建产物可直接从磁盘路径打开
defaultContentLanguage: zh
enableGitInfo: false
  # 说明：enableGitInfo 用于从 Git 提交记录中读取每页的最后修改时间。
  # 本站为离线复刻工程，未纳入 Git 版本管理，保持 false 可避免构建报错。
enableRobotsTXT: true
enableEmoji: true
timeZone: UTC

languages:
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 1
    title: *siteTitle
    hasCJKLanguage: true
    params:
      description: Apache RocketMQ 中文文档复刻站：从产品认知、领域模型到部署运维与生态组件的系统化技术文档。

# OINK's Markdown components depend on these three Goldmark settings.
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false

outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

params:
  offline_search: true
  copyright:
    authors: RocketMQ 文档复刻
    from_year: 2026
  footer_center_info: '本文档为 Apache RocketMQ 官方中文文档的复刻整理版，内容依据 apache/rocketmq-site 官方仓库中文文档重写。'
  ui:
    dark_mode: true
    section_index: cards
    blog_index: cards
    sidebar_menu_foldable: true
    sidebar_expand_levels: 4
    sidebar_icon_policy: groups
    backlinks: true

module:
  imports:
    - path: github.com/pgsty/oink
      replacement: ./oink-main/oink-main
  hugoVersion:
    extended: true
    min: 0.160.1
