# OINK Starter — the only site configuration file.
# Change the two marked values first; everything else builds as-is.

title: &siteTitle Project Name # CHANGE ME: one shared title for every language
baseURL: https://example.org/ # CHANGE ME: canonical production URL
relativeURLs: true # 相对链接：构建产物可直接从磁盘路径打开，也可挂任意子路径
defaultContentLanguage: zh  # 默认的语言
enableGitInfo: true
enableRobotsTXT: true
enableEmoji: true
timeZone: UTC

languages:
#  en:
#    label: English
#    locale: en-US
#    weight: 1
#    title: *siteTitle
#    params:
#      description: Documentation, updates, and guides for your project.
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    title: *siteTitle
    hasCJKLanguage: true
    params:
      description: 你的项目文档、动态与指南。
#  fr:
#    label: Français
#    locale: fr-FR
#    weight: 3
#    title: *siteTitle
#    params:
#      description: Documentation, actualités et guides de votre projet.

# OINK's Markdown components depend on these three Goldmark settings.
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false

outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

params:
  offline_search: true
  copyright:
    authors: Project contributors
    from_year: 2026
  footer_center_info: ''
  ui:
    dark_mode: true
    section_index: cards
    blog_index: cards
    sidebar_menu_foldable: true
    sidebar_expand_levels: 4
    sidebar_icon_policy: groups
    backlinks: true
    # 视觉预设（OINK 1.2+）：读者在页面 Appearance 面板一键切换，选择写入
    # localStorage 跨页记住、首帧前应用无闪烁。`preset` 是站点默认观感，必须出现在
    # `preset_menu` 里（漏了主题会 warn 并自动补上）。明暗切换由上面的 `dark_mode` 单独管。
    # 想要单一外观：把 preset_menu 改成 false（只留 preset）或缩成 [paper]。
    # 默认观感；要 1.0/1.1 的技术风改成 slate。
    # 4 套全开（技能默认交付）。
    preset: paper
    preset_menu: [paper, slate, ink, terminal]
    # theme_color: '#245f94'
    # typography: system
    # image_zoom: true
    # share: [mastodon, linkedin, email, copy]
    # feedback:
    #   enable: true
    #   reasons: true

  # Optional repository links. Uncomment after creating your own repository.
  # github_repo: https://github.com/OWNER/REPOSITORY
  # github_branch: main

  # Optional brand assets. The starter already supplies a neutral logo.
  # logo: icons/logo.svg
  # wordmark: icons/wordmark.svg

  # Optional Giscus comments. Nothing is loaded until the entire block is set.
  # comments:
  #   enable: true
  #   type: giscus
  #   giscus:
  #     repo: OWNER/REPOSITORY
  #     repoId: R_xxxxxxxxxx
  #     category: Announcements
  #     categoryId: DIC_xxxxxxxxxx
  #     mapping: pathname
  #     inputPosition: bottom
  #     theme: auto
  #     loading: lazy

  # Optional layout choice. Theme defaults remain active while commented.
  # page_width: wide

# Optional Google Analytics. Production builds only; previews stay untracked.
# services:
#   googleAnalytics:
#     id: G-XXXXXXXXXX

module:
  imports:
    - path: github.com/pgsty/oink
      replacement: ./oink-main/oink-main
  hugoVersion:
    extended: true
    min: 0.168.0
