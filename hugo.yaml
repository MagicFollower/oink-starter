# 站点配置 —— 由 oink-doc-site 技能的 plan_site.py 生成
# 站点身份请优先改 site.plan.json 后重跑；下面的主题契约项不要手删。
title: &siteTitle ZooKeeper 文档
baseURL: https://example.org/
relativeURLs: true # 产物可挂任意子路径；file:// 只有文字预览，完整功能走 HTTP
defaultContentLanguage: zh
enableGitInfo: false # 未入 Git 或内网环境保持 false，避免 dubious ownership 中断构建
enableRobotsTXT: true
enableEmoji: true
timeZone: UTC

# 顶栏导航：OINK 1.4.0 只渲染 .Site.Menus.main，不会自动挂 docs 入口。
# 这个入口由 plan_site.py 每次生成；重跑计划会保留，不要手删。
menus:
  main:
    - identifier: docs
      name: 文档
      pageRef: /docs
      weight: 1

languages:
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 1
    title: *siteTitle
    hasCJKLanguage: true
    params:
      description: 基于 Apache ZooKeeper 3.8.7 与 Dubbo 3.2.20 的中文文档站：从 ZooKeeper 核心概念、单机上手、端口与管理接口、三节点集群，到 ZooKeeper + Dubbo 的架构、注册发现、节点读写，以及 Spring Boot 2.7.18 + Java 8 的从零实战工程。

# OINK 的 Markdown 组件依赖这三项 Goldmark 设置，删掉会让 callout/图表/卡片失效。
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false

# markdown 输出让每页额外产出可下载的 .md；print 供整节打印档。
outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

params:
  offline_search: true
  copyright:
    authors: ZooKeeper 文档站贡献者
    from_year: 2026
  footer_center_info: '内容基于 Apache ZooKeeper 3.8.7 发行包与官方文档整理；Apache ZooKeeper 是 Apache 软件基金会的商标。'
  ui:
    dark_mode: true
    section_index: cards
    blog_index: cards
    sidebar_menu_foldable: true
    sidebar_expand_levels: 4
    sidebar_icon_policy: groups
    backlinks: true
    # 视觉预设（OINK 1.2+）：读者可在 Appearance 面板一键切换，选择写入
    # localStorage 跨页记住、首帧前应用无闪烁。`preset` 必须出现在 `preset_menu` 里。
    # 只想要单一外观：把 preset_menu 改成 false。
    preset: paper
    preset_menu: [paper, slate, ink, terminal]
  # github_repo: https://github.com/OWNER/REPOSITORY
  # github_branch: main
  # logo: icons/logo.svg

module:
  imports:
    - path: github.com/pgsty/oink
      replacement: ./oink-main/oink-main
  hugoVersion:
    extended: true
    min: 0.168.0
